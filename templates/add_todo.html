<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adding new Todo item</title>
  </head>
  <style>
    /* Form Container */
    .todo-form-container {
      max-width: 600px;
      margin: 2rem auto;
      padding: 2rem;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    /* Form Title */
    .form-header {
      color: #2d3436;
      margin-bottom: 1.5rem;
      font-size: 1.8rem;
      text-align: center;
    }

    /* Form Elements */
    .todo-form {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .form-group label {
      font-weight: 600;
      color: #2d3436;
      font-size: 1rem;
    }

    .form-group input[type="text"] {
      padding: 0.75rem 1rem;
      border: 2px solid #dfe6e9;
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .form-group input[type="text"]:focus {
      outline: none;
      border-color: #4361ee;
      box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
    }

    /* Submit Button */
    .submit-btn {
      background: #00b894;
      color: white;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 1rem;
    }

    .submit-btn:hover {
      background: #00b894;
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(67, 97, 238, 0.3);
    }

    /* Dark Mode Styles */
    .dark-mode .todo-form-container {
      background: #2d3436;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }

    .dark-mode .form-header,
    .dark-mode .form-group label {
      color: #f5f6fa;
    }

    .dark-mode .form-group input[type="text"] {
      background: #3d4549;
      border-color: #4b5357;
      color: #f5f6fa;
    }

    .dark-mode .form-group input[type="text"]:focus {
      border-color: #4361ee;
      box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.3);
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .todo-form-container {
        padding: 1.5rem;
        margin: 1rem;
      }
    }
  </style>
  <body>
    <div class="todo-form-container">
      <h2 class="form-header">Create New Todo</h2>
      <form class="todo-form" action="" method="POST">
        {% csrf_token %}
        <div class="form-group">
          <label for="title">Title:</label>
          <input type="text" name="title" id="title" required />
        </div>
        <div class="form-group">
          <label for="description">Description:</label>
          <input type="text" name="description" id="description" />
        </div>
        <input type="submit" value="Create Todo" class="submit-btn" />
      </form>
    </div>
  </body>
</html>
