{% load static %}
<script src="{% static 'js/script.js' %}" defer></script>
<style>
  body {
    background-color: #f5f5f5;
  }
  body.dark-mode {
    background-color: #121212;
    color: #f0f0f0;
  }
  .div-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .todo-form-container {
    max-width: 600px;
    margin: 2rem auto;
    padding: 2rem;
    border-radius: 12px;
    background: #ffffff;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
  }

  .todo-form-container h2 {
    color: #2d3436;
    margin-bottom: 1.5rem;
    text-align: center;
    font-size: 1.8rem;
  }

  .todo-form {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .form-group label {
    font-weight: 600;
    color: #2d3436;
    font-size: 1rem;
  }

  .form-group input[type="text"] {
    padding: 0.75rem 1rem;
    border: 1px solid #dfe6e9;
    border-radius: 8px;
    font-size: 1rem;
    transition: all 0.3s ease;
  }

  .form-group input[type="text"]:focus {
    outline: none;
    border-color: #00b894;
    box-shadow: 0 0 0 3px rgba(0, 184, 148, 0.2);
  }

  .cancel-btn {
    background: #00b894;
    color: white;
    padding: 0.75rem 1.5rem;
    border: none;
    border-radius: 8px;
    font-size: 1.2rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 1rem;
    text-decoration: none;
  }

  .submit-btn {
    background: #00b894;
    color: white;
    padding: 0.75rem 1.5rem;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    margin-top: 1rem;
  }

  .submit-btn:hover {
    background: #00a884;
    transform: translateY(-2px);
    box-shadow: 0 4px 8px rgba(0, 184, 148, 0.3);
  }

  .dark-mode .todo-form-container {
    background: #2d3436;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
  }

  .dark-mode .todo-form-container h2,
  .dark-mode .form-group label {
    color: #f5f6fa;
  }

  .dark-mode .form-group input[type="text"] {
    background: #3d4549;
    border-color: #4b5357;
    color: #f5f6fa;
  }

  .dark-mode .form-group input[type="text"]:focus {
    border-color: #00b894;
    box-shadow: 0 0 0 3px rgba(0, 184, 148, 0.3);
  }

  @media (max-width: 768px) {
    .todo-form-container {
      padding: 1.5rem;
      margin: 1rem;
    }
  }
</style>
<div class="todo-form-container">
  <h2>Update Todo</h2>
  <form class="todo-form" action="" method="POST">
    {% csrf_token %}
    <div class="form-group">
      <label for="title">Title:</label>
      <input type="text" name="title" value="{{todos.title}}" id="title" />
    </div>
    <div class="form-group">
      <label for="description">Description:</label>
      <input
        type="text"
        name="description"
        value="{{todos.description}}"
        id="description"
      />
    </div>
    <div class="div-btn">
      <input type="submit" value="Update" class="submit-btn" />
      <a class="cancel-btn" href="{% url 'details' todos.pk %}">Cancel</a>
    </div>
  </form>
</div>
